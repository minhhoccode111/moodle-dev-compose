# Deploy stack for lms.e-biz.com.vn (Moodle 3.5.7, VPS 192.168.50.111).
# TLS terminates at HAProxy upstream; host nginx (installed by CI) proxies :80 to this stack.

services:
  moodle:
    ports:
      - "8035:80"
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - /var/moodle/moodledata35:/var/www/moodledata
      # NOTE: location of moodle repo on the runner machine
      - $MOODLE_DOCKER_WWWROOT:/var/www/html
    networks:
      - devbox
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  devbox:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.31.0.0/16
